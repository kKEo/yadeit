name: CI

on:
  push:
    branches: [master, reincarnation]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # The test suite runs against every supported database.
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: pgsql
            port: 5432
          - db: mariadb
            port: 3306
    name: backend-tests (${{ matrix.db }})
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yadeit
          POSTGRES_PASSWORD: yadeit
          POSTGRES_DB: yadeit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yadeit -d yadeit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: yadeit
          MARIADB_PASSWORD: yadeit
          MARIADB_DATABASE: yadeit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: yadeit_test
      DB_USERNAME: yadeit
      DB_PASSWORD: yadeit
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_mysql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm run test

  # The runner of the Traffic lab (docs/traffic-lab.md). Its types come from the web app's API types,
  # so an API change that the simulator does not follow fails here.
  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test

  # Simulated teams against the real stack in Docker: three teams for two minutes at ten times speed.
  # Fails when requests, actions or whole flows fail, or the run misses its thresholds. Only on master:
  # it builds the image and takes several minutes.
  simulator-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend-tests, frontend, simulator]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Smoke run
        run: make sim-smoke
      - name: Logs of the app, when it failed
        if: failure()
        run: docker compose -p yadeit-local --env-file .env.docker -f compose.prod.yaml -f compose.sim.yaml logs --tail=200 app worker

  # The documentation site: the landing page above the user and operator guides (make docs-build).
  # Built on every push and pull request, so a broken SUMMARY.md fails the check.
  docs:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: '0.5.4'
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSfL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the site
        run: make docs-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the site to GitHub Pages from master only.
  # Needs Settings → Pages → Source: "GitHub Actions" in the repository.
  docs-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
