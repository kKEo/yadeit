<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">How an item moves through its states</title>
  <desc id="d">Triage, then Backlog, then Todo, then In progress, then In review, then Done. Cancelled can be reached from any state.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="170" rx="14" fill="#ffffff"/>
  <g>
    <rect x="16" y="40" width="96" height="40" rx="20" fill="#ede9fe" stroke="#a78bfa"/><text x="64" y="65" text-anchor="middle" fill="#4c1d95">Triage</text>
    <rect x="140" y="40" width="96" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8"/><text x="188" y="65" text-anchor="middle" fill="#334155">Backlog</text>
    <rect x="264" y="40" width="96" height="40" rx="20" fill="#f1f5f9" stroke="#64748b"/><text x="312" y="65" text-anchor="middle" fill="#334155">Todo</text>
    <rect x="388" y="40" width="108" height="40" rx="20" fill="#fef3c7" stroke="#f59e0b"/><text x="442" y="65" text-anchor="middle" fill="#78350f">In progress</text>
    <rect x="524" y="40" width="100" height="40" rx="20" fill="#dbeafe" stroke="#3b82f6"/><text x="574" y="65" text-anchor="middle" fill="#1e3a8a">In review</text>
    <rect x="652" y="40" width="92" height="40" rx="20" fill="#dcfce7" stroke="#22c55e"/><text x="698" y="65" text-anchor="middle" fill="#14532d">Done</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)">
    <line x1="112" y1="60" x2="138" y2="60"/><line x1="236" y1="60" x2="262" y2="60"/><line x1="360" y1="60" x2="386" y2="60"/><line x1="496" y1="60" x2="522" y2="60"/><line x1="624" y1="60" x2="650" y2="60"/>
  </g>
  <rect x="330" y="118" width="100" height="36" rx="18" fill="#fee2e2" stroke="#ef4444"/><text x="380" y="141" text-anchor="middle" fill="#7f1d1d">Cancelled</text>
  <text x="380" y="106" text-anchor="middle" fill="#6b7280" font-size="12">from any state</text>
  <text x="16" y="24" fill="#6b7280" font-size="12">Groups: triage · backlog · to do · in progress (started) · done · cancelled</text>
</svg>
