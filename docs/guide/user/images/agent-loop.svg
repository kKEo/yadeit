<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">An agent's working loop</title>
  <desc id="d">A person delegates an item. The agent claims it, posts its plan, may ask a question and wait for an answer, links its pull request, and submits for review. A person reviews and moves the item to Done.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
  <rect width="760" height="200" rx="14" fill="#ffffff"/>
  <text x="16" y="26" fill="#6b7280" font-size="12">Person</text>
  <text x="16" y="186" fill="#6b7280" font-size="12">Agent</text>
  <rect x="16" y="40" width="120" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="76" y="67" text-anchor="middle" fill="#4c1d95">Delegates item</text>
  <rect x="120" y="120" width="96" height="44" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="168" y="147" text-anchor="middle" fill="#155e75">Claims it</text>
  <rect x="236" y="120" width="110" height="44" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="291" y="147" text-anchor="middle" fill="#155e75">Posts its plan</text>
  <rect x="366" y="120" width="120" height="44" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="426" y="147" text-anchor="middle" fill="#155e75">Asks a question</text>
  <rect x="366" y="40" width="120" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="426" y="67" text-anchor="middle" fill="#4c1d95">Answers</text>
  <rect x="506" y="120" width="110" height="44" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="561" y="141" text-anchor="middle" fill="#155e75">Links PR,</text><text x="561" y="157" text-anchor="middle" fill="#155e75">submits</text>
  <rect x="624" y="40" width="120" height="44" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="684" y="61" text-anchor="middle" fill="#14532d">Reviews,</text><text x="684" y="77" text-anchor="middle" fill="#14532d">moves to Done</text>
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M110 84 L150 118"/>
    <line x1="216" y1="142" x2="234" y2="142"/>
    <line x1="346" y1="142" x2="364" y2="142"/>
    <path d="M410 120 L410 86"/>
    <path d="M442 86 L442 118"/>
    <line x1="486" y1="142" x2="504" y2="142"/>
    <path d="M616 130 L650 86"/>
  </g>
  <text x="446" y="104" fill="#6b7280" font-size="11">needs input</text>
</svg>
