; Uploads up to 20 MB (the application's own limit) with some room for the request around them.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; The code in the image never changes while it runs.
opcache.validate_timestamps = 0
